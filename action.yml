name: mcp-health-doctor
description: Scan MCP server configs for broken entries, drift, and optional probes
author: leon-pixel

branding:
  icon: check-circle
  color: green

inputs:
  path:
    description: Project root to scan
    required: false
    default: "."
  args:
    description: Additional CLI flags, appended after --no-user. For example --online or --probe. Setting this does not replace --no-user. Set include-user to true to scan user-level configs.
    required: false
    default: ""
  include-user:
    description: Scan the runner's user-level MCP configs (Cursor, Claude, VS Code, Codex, and the rest). Default false passes --no-user. An explicit --no-user in args still skips those configs.
    required: false
    default: "false"
  node-version:
    description: Node.js version
    required: false
    default: "22"
  annotations:
    description: Emit GitHub Actions warning and error annotations for findings
    required: false
    default: "true"
  sarif-file:
    description: SARIF 2.1.0 path to write, relative to the job workspace. Set to false to skip the file.
    required: false
    default: mcp-health.sarif
  upload-sarif:
    description: Upload the SARIF file with github/codeql-action/upload-sarif. The job needs security-events write, and the repository needs code scanning.
    required: false
    default: "false"
  fail-on-missing:
    description: Fail the job when no MCP config file is found. Default false.
    required: false
    default: "false"

outputs:
  exit-code:
    description: mcp-health exit code (0 ok, 1 warn, 2 fail)
    value: ${{ steps.run.outputs.exit-code }}
  sarif-file:
    description: SARIF path passed to the CLI, when a file was requested
    value: ${{ steps.run.outputs.sarif-file }}

runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}

    - name: Install and build mcp-health
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        npm ci
        npm run build

    - name: Run mcp-health check
      id: run
      shell: bash
      run: |
        set +e
        flags=()
        if [ "${{ inputs.annotations }}" = "true" ]; then
          flags+=(--github-annotations)
        fi
        if [ "${{ inputs.fail-on-missing }}" != "true" ]; then
          flags+=(--allow-missing)
        fi
        # args are additional flags. GitHub replaces an input default when
        # the workflow sets it, so --no-user cannot live only as the args default.
        # include-user: true is the opt-in that reads the runner's user configs.
        if [ "${{ inputs.include-user }}" != "true" ]; then
          flags+=(--no-user)
        fi
        sarif="${{ inputs.sarif-file }}"
        if [ -n "$sarif" ] && [ "$sarif" != "false" ]; then
          flags+=(--sarif "$sarif")
          echo "sarif-file=$sarif" >> "$GITHUB_OUTPUT"
        fi
        node "${{ github.action_path }}/dist/cli.js" check "${flags[@]}" ${{ inputs.args }} "${{ inputs.path }}"
        code=$?
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"
        # Leave this step green so a later upload can still run. The last step restores the code.
        exit 0

    - name: Upload SARIF
      if: ${{ always() && inputs.upload-sarif == 'true' && steps.run.outputs.sarif-file != '' }}
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: ${{ steps.run.outputs.sarif-file }}

    - name: Propagate mcp-health exit code
      if: ${{ always() }}
      shell: bash
      run: exit ${{ steps.run.outputs.exit-code }}
