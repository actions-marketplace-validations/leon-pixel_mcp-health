name: release

# Stable tags only. v1.2.3 matches; the moving major tag v1 does not, so
# updating v1 does not start another release.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require a stable tag that matches package.json
        id: ver
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Tag ${tag} is not a stable vX.Y.Z release."
            echo "Prerelease tags are not published and do not move the major tag."
            exit 1
          fi
          pkg="$(node -p "require('./package.json').version")"
          ver="${tag#v}"
          if [[ "$ver" != "$pkg" ]]; then
            echo "Tag ${tag} does not match package.json version ${pkg}."
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${ver}" >> "$GITHUB_OUTPUT"
          echo "major=v${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Changelog section for this version
        shell: bash
        run: node scripts/changelog-section.mjs "${{ steps.ver.outputs.version }}" CHANGELOG.md > release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          body_path: release-notes.md
          generate_release_notes: false

      - name: Move the major version tag
        shell: bash
        run: |
          major="${{ steps.ver.outputs.major }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "$major"
          git push origin "refs/tags/${major}" --force
          echo "Moved ${major} to ${GITHUB_SHA}"

      - name: Publish @leon-pixel/mcp-health to npm
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          npm install -g npm@11
          published=0
          if [ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then
            if npm publish --access public --provenance; then
              published=1
              echo "Published with trusted publishing (OIDC) and provenance."
            else
              echo "Trusted publishing did not succeed."
            fi
          fi
          if [ "$published" -eq 0 ] && [ -n "$NPM_TOKEN" ]; then
            echo "Publishing with NPM_TOKEN."
            NODE_AUTH_TOKEN="$NPM_TOKEN" npm publish --access public --provenance
            published=1
          fi
          if [ "$published" -eq 0 ]; then
            echo "Skipping npm publish."
            echo "Add a trusted publisher for .github/workflows/release.yml on npmjs.com, or set the NPM_TOKEN secret."
            exit 0
          fi
